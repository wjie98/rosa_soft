name: Build matrix

on: [push, pull_request]

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ninja
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0
      - name: Build SAM-only extension
        env:
          USE_CUDA: "0"
        run: python -m pip install --no-build-isolation -e ".[test]"
      - run: python -m pytest -q
