name: CUDA full

on:
  workflow_dispatch:

jobs:
  cuda-full:
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch pytest ninja
      - name: Build ROSA and RWKV7 CUDA extension
        env:
          USE_CUDA: "1"
          ROSA_BUILD_RWKV7: "1"
        run: python -m pip install --no-build-isolation -v -e .
      - name: Require executable CUDA capabilities
        run: |
          python - <<'PY'
          import torch
          import rosa_soft
          assert torch.cuda.is_available(), "CUDA tests must not all skip"
          assert rosa_soft.BUILD_CAPABILITIES["variant"] == "cuda-rwkv7"
          assert rosa_soft.HAS_ROSA_RUNTIME
          assert rosa_soft.HAS_ROSA_SOFT_CUDA
          assert rosa_soft.HAS_RWKV7_CUDA
          PY
      - run: >-
          python -m pytest
          tests/test_build_contract.py
          tests/test_runtime.py
          tests/test_soft_cuda.py
