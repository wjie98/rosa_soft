[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

# Native builds compile against the PyTorch ABI in the invoking environment.
# Install PyTorch first and pass --no-build-isolation to pip.
